# ==============================================================================
# Perfil QA (Staging en la Nube - StyleRadar ms-segunda-vida-donaciones)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: qa

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:styleradar_donations_qa}?sslmode=require}
    username: ${DB_USER:styleradar_qa_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: StyleRadar-Donations-QA-HikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:styleradar-rabbitmq-qa.northcentralus.cloudapp.azure.com}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:ms_donaciones}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}
      trust-store: ${RABBITMQ_TRUSTSTORE_PATH:classpath:certs/rabbitmq-truststore.jks}
      trust-store-password: ${RABBITMQ_TRUSTSTORE_PASSWORD:changeit}
      trust-store-type: JKS
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    publisher-confirm-type: correlated
    publisher-returns: true

# Configuración de mensajería asíncrona en QA (styleradar.exchange)
app:
  rabbitmq:
    exchange:
      main: ${RABBITMQ_EXCHANGE:styleradar.exchange}
      chat: ${RABBITMQ_CHAT_EXCHANGE:styleradar.events}
      dlx: ${RABBITMQ_DLX:styleradar.dlx}
      donations: ${RABBITMQ_EXCHANGE:styleradar.exchange}
    routing-keys:
      donation-status-updated: ${RABBITMQ_ROUTING_KEY_DONACION:styleradar.donaciones.estado.cambiado}
      second-hand-sold: ${RABBITMQ_ROUTING_KEY_SEGUNDA_VIDA:segunda-mano.prenda.vendida}
      donation-request-created: ${RABBITMQ_ROUTING_KEY_DONACION:styleradar.donaciones.estado.cambiado}
    queues:
      dlq: ${RABBITMQ_DLQ:styleradar.donaciones.dlq}
      notifications-donation-created: ${RABBITMQ_NOTIFICATIONS_QUEUE:q.notificaciones.donacion-solicitud-creada}
      simulator-queue: ${RABBITMQ_SIMULATOR_QUEUE:q.donaciones.simulador-notificaciones}
    simulator:
      enabled: false

# Swagger OpenAPI Público para QA
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tryItOutEnabled: true
    operationsSorter: method
    tagsSorter: alpha

# Health Check y Métricas para QA
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    edu.dosw.styleradar.donaciones: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
