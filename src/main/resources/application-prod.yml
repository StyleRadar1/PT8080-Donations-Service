# ==============================================================================
# Perfil PROD (Producción en la Nube - StyleRadar ms-segunda-vida-donaciones)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: prod

  # Base de Datos Relacional Aislada e Independiente para Producción (Pág. 8)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:styleradar_donations_prod}?sslmode=require}
    username: ${DB_USER:styleradar_prod_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: StyleRadar-Donations-PROD-HikariPool
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:prod}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}
      trust-store: ${RABBITMQ_TRUSTSTORE_PATH:classpath:certs/rabbitmq-truststore.jks}
      trust-store-password: ${RABBITMQ_TRUSTSTORE_PASSWORD:changeit}
      trust-store-type: ${RABBITMQ_TRUSTSTORE_TYPE:PKCS12}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:false}
    publisher-confirm-type: correlated
    publisher-returns: true

# Configuración de mensajería asíncrona y almacenamiento en PROD
app:
  rabbitmq:
    exchange:
      main: ${RABBITMQ_EXCHANGE:styleradar.exchange}
      chat: ${RABBITMQ_CHAT_EXCHANGE:styleradar.exchange}
      dlx: ${RABBITMQ_DLX:styleradar.dlx}
      donations: ${RABBITMQ_DONATIONS_EXCHANGE:${RABBITMQ_EXCHANGE:styleradar.exchange}}
    routing-keys:
      donation-status-updated: ${RABBITMQ_ROUTING_KEY_DONACION:styleradar.donaciones.estado.cambiado}
      second-hand-sold: ${RABBITMQ_ROUTING_KEY_SEGUNDA_VIDA:segunda-mano.prenda.vendida}
      notifications-second-hand-sold: ${RABBITMQ_ROUTING_KEY_NOTIFICACIONES_SEGUNDA_VIDA:styleradar.segundavida.prenda.vendida}
      donation-request-created: ${RABBITMQ_ROUTING_KEY_DONACION_CREATED:styleradar.donaciones.solicitud.creada}
    queues:
      dlq: ${RABBITMQ_DLQ:styleradar.donaciones.dlq}
      notifications-donation-created: ${RABBITMQ_NOTIFICATIONS_QUEUE:q.notificaciones.donacion-solicitud-creada}
      simulator-queue: ${RABBITMQ_SIMULATOR_QUEUE:q.donaciones.simulador-notificaciones}
    simulator:
      enabled: false
    topology:
      enabled: ${RABBITMQ_DECLARE_TOPOLOGY:false}

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:donaciones-fotos}
    blob-endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:https://srdonacionesjmunar.blob.core.windows.net}

# Documentación OpenAPI en Producción
springdoc:
  api-docs:
    path: /api/v1/v3/api-docs
    enabled: true
  swagger-ui:
    path: /api/v1/swagger-ui.html
    enabled: true
    tryItOutEnabled: false
    operationsSorter: method
    tagsSorter: alpha

# Health Check y Métricas de Producción
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

logging:
  level:
    edu.dosw.styleradar.donaciones: WARN
    org.springframework.web: WARN
    org.springframework.security: ERROR

# Integración con ms-tiendas (Catálogo maestro de fundaciones aliadas)
styleradar:
  tiendas:
    base-url: ${TIENDAS_SERVICE_URL:https://styleradar-tiendas-prod.azurewebsites.net}
    validation-enabled: ${TIENDAS_VALIDATION_ENABLED:true}
    forward-bearer-token: ${TIENDAS_FORWARD_BEARER_TOKEN:true}
