server:
  port: 8520

spring:
  application:
    name: ms-segunda-vida-donaciones-test

  datasource:
    url: jdbc:h2:mem:donations_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health, info

styleradar:
  tiendas:
    base-url: http://localhost:8140
    validation-enabled: false
