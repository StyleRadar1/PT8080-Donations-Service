server:
  port: 8520
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-segunda-vida-donaciones-test

  datasource:
    url: jdbc:h2:mem:donations_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
