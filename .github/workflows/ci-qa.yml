name: CI/CD QA Pipeline - ms-segunda-vida-donaciones

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ==============================================================================
  # Fase 1 & 2: Compilación, Pruebas Automatizadas y Compuerta de Calidad (JaCoCo)
  # ==============================================================================
  build-and-test:
    name: Build, Test, Coverage & Docker Packaging (QA)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 2.1 Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: 3. Clean & Compile
        run: ./mvnw -B clean compile

      - name: 4. Verify Docker Daemon & Socket Permissions
        run: |
          docker version
          sudo systemctl start docker || true
          sudo chmod 666 /var/run/docker.sock || true

      - name: 5. Unit & Integration Tests with JaCoCo Report & Quality Gate (>= 85% Line / >= 80% Branch)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_API_VERSION: "1.44"
        run: ./mvnw -B verify -Dapi.version=1.44

      - name: 6. SonarQube / SonarCloud Quality Gate Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "❌ ERROR: SONAR_TOKEN no está configurado en GitHub Repository Secrets (obligatorio en rama develop)."
            exit 1
          fi
          SONAR_ARGS="-Dsonar.qualitygate.wait=true"
          if [ -n "$SONAR_HOST_URL" ]; then
            SONAR_ARGS="$SONAR_ARGS -Dsonar.host.url=$SONAR_HOST_URL"
          fi
          if [ -n "$SONAR_ORGANIZATION" ]; then
            SONAR_ARGS="$SONAR_ARGS -Dsonar.organization=$SONAR_ORGANIZATION"
          fi
          if [ -n "$SONAR_PROJECT_KEY" ]; then
            SONAR_ARGS="$SONAR_ARGS -Dsonar.projectKey=$SONAR_PROJECT_KEY"
          fi
          ./mvnw -B sonar:sonar $SONAR_ARGS

      - name: 7. Package Application JAR
        run: ./mvnw -B package -DskipTests -Dbuild.commit.sha=${{ github.sha }}

      - name: 8. Build Docker OCI Image
        run: |
          docker build --build-arg COMMIT_SHA=${{ github.sha }} -t sr-ms-segunda-vida-donaciones:${{ github.sha }} .
          docker tag sr-ms-segunda-vida-donaciones:${{ github.sha }} sr-ms-segunda-vida-donaciones:latest

      - name: 9. Publish JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: 10. Publish Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/ms-segunda-vida-donaciones-*.jar
          retention-days: 7

  # ==============================================================================
  # Fase 3: Despliegue Automático al Ambiente QA (Trigger: Push/Merge a 'develop')
  # ==============================================================================
  deploy-qa:
    name: Deploy to QA Environment (Azure Cloud Staging)
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: qa
      url: ${{ vars.QA_APP_URL || 'https://styleradar-donaciones-qa-jmunar.azurewebsites.net' }}
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE_QA: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
      DEPLOY_WEBHOOK_QA: ${{ secrets.DEPLOY_WEBHOOK_QA }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Download Application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: 3. Validate Azure Deployment Credentials (QA)
        run: |
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE_QA" ] && [ -z "$DEPLOY_WEBHOOK_QA" ]; then
            echo "❌ ERROR: Faltan las credenciales de despliegue de Azure para QA en GitHub Secrets."
            echo "   Debe configurar AZURE_WEBAPP_PUBLISH_PROFILE_QA o DEPLOY_WEBHOOK_QA en el repositorio."
            exit 1
          fi
          echo "✅ Credenciales de despliegue para QA validadas."

      - name: 4. Deploy to Azure Web App (QA)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_QA != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: styleradar-donaciones-qa-jmunar
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          package: 'target/*.jar'

      - name: 5. Deploy via Webhook (QA Fallback)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_QA == '' && env.DEPLOY_WEBHOOK_QA != ''
        run: |
          echo "-> Invocando Webhook de despliegue QA..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_WEBHOOK_QA")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ ERROR: El webhook de despliegue QA retornó código HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Webhook de despliegue QA ejecutado exitosamente (HTTP $HTTP_CODE)."

      - name: 6. QA Smoke Test, Health Check, Swagger OpenAPI & Deployment Verification
        run: |
          QA_BASE_URL="${{ vars.QA_APP_URL || 'https://styleradar-donaciones-qa-jmunar.azurewebsites.net' }}"
          QA_HEALTH_URL="$QA_BASE_URL/api/v1/health"
          QA_SWAGGER_DOCS_URL="$QA_BASE_URL/api/v1/v3/api-docs"
          QA_SWAGGER_UI_URL="$QA_BASE_URL/api/v1/swagger-ui/index.html"
          EXPECTED_COMMIT_SHA="${{ github.sha }}"
          echo "======================================================================"
          echo " Iniciando Smoke Test en QA:"
          echo "   Health Check : $QA_HEALTH_URL"
          echo "   OpenAPI JSON : $QA_SWAGGER_DOCS_URL"
          echo "   Swagger UI   : $QA_SWAGGER_UI_URL"
          echo "   Commit SHA   : $EXPECTED_COMMIT_SHA"
          echo "======================================================================"

          SUCCESS=false
          for i in {1..30}; do
            echo "Intento $i de 30..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$QA_HEALTH_URL" || true)
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "Health HTTP Status -> $HTTP_STATUS"
            echo "Health Response Body -> $BODY"

            if [ "$HTTP_STATUS" = "200" ]; then
              STATUS_FIELD=$(echo "$BODY" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || true)
              COMMIT_SHA_FIELD=$(echo "$BODY" | grep -o '"commitSha":"[^"]*"' | cut -d'"' -f4 || true)

              if [ "$STATUS_FIELD" = "UP" ]; then
                echo "-> Estado del servicio en QA: UP"
                if [ -z "$COMMIT_SHA_FIELD" ]; then
                  echo "⏳ El commitSha aún no está presente en la respuesta (posible reinicio en curso con versión previa)..."
                elif [ "$COMMIT_SHA_FIELD" != "$EXPECTED_COMMIT_SHA" ] && [[ "$EXPECTED_COMMIT_SHA" != "$COMMIT_SHA_FIELD"* ]]; then
                  echo "⏳ El commitSha reportado ($COMMIT_SHA_FIELD) aún no coincide con el nuevo commit ($EXPECTED_COMMIT_SHA). Esperando propagación del artefacto..."
                else
                  SWAGGER_DOCS_STATUS=$(curl -s -o /tmp/qa-openapi.json -w "%{http_code}" "$QA_SWAGGER_DOCS_URL" || true)
                  SWAGGER_UI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$QA_SWAGGER_UI_URL" || true)
                  echo "Swagger OpenAPI JSON HTTP -> $SWAGGER_DOCS_STATUS | Swagger UI HTTP -> $SWAGGER_UI_STATUS"
                  if [ "$SWAGGER_DOCS_STATUS" = "200" ] && grep -q '"openapi"' /tmp/qa-openapi.json && [ "$SWAGGER_UI_STATUS" = "200" ]; then
                    echo "✅ Commit SHA desplegado ($COMMIT_SHA_FIELD) y Swagger/OpenAPI en QA verificados exitosamente."
                    SUCCESS=true
                    break
                  fi
                  echo "⏳ Swagger/OpenAPI aún no responde HTTP 200 completo. Reintentando..."
                fi
              fi
            fi
            sleep 10
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ ERROR CRÍTICO: El Smoke Test de QA no confirmó UP + commit $EXPECTED_COMMIT_SHA + Swagger HTTP 200 tras 30 intentos (300s)."
            exit 1
          fi
          echo "✅ Despliegue en QA completado y verificado con éxito."
