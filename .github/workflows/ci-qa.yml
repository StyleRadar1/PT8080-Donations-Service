name: CI/CD QA Pipeline - ms-segunda-vida-donaciones

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ==============================================================================
  # Fase 1 & 2: Compilación, Pruebas Automatizadas y Compuerta de Calidad (JaCoCo)
  # ==============================================================================
  build-and-test:
    name: Build, Test, Coverage & Docker Packaging (QA)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Clean & Compile
        run: mvn -B clean compile

      - name: 4. Verify Docker Daemon & Socket Permissions
        run: |
          docker version
          sudo systemctl start docker || true
          sudo chmod 666 /var/run/docker.sock || true

      - name: 5. Unit & Integration Tests with JaCoCo Report
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_API_VERSION: "1.44"
        run: mvn -B test jacoco:report -Dapi.version=1.44

      - name: 6. Verify Quality Gate & JaCoCo Coverage (Threshold >= 85%)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_API_VERSION: "1.44"
        run: mvn -B verify -Dapi.version=1.44

      - name: 7. Package Application JAR
        run: mvn -B package -DskipTests -Dbuild.commit.sha=${{ github.sha }}

      - name: 8. Build Docker OCI Image
        run: |
          docker build --build-arg COMMIT_SHA=${{ github.sha }} -t sr-ms-segunda-vida-donaciones:${{ github.sha }} .
          docker tag sr-ms-segunda-vida-donaciones:${{ github.sha }} sr-ms-segunda-vida-donaciones:latest

      - name: 9. Publish JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: 10. Publish Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/ms-segunda-vida-donaciones-*.jar
          retention-days: 7

  # ==============================================================================
  # Fase 3: Despliegue Automático al Ambiente QA (Trigger: Push/Merge a 'develop')
  # ==============================================================================
  deploy-qa:
    name: Deploy to QA Environment (Azure Cloud Staging)
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: qa
      url: ${{ vars.QA_APP_URL || 'https://styleradar-donaciones-qa-jmunar.azurewebsites.net' }}
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE_QA: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
      DEPLOY_WEBHOOK_QA: ${{ secrets.DEPLOY_WEBHOOK_QA }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Download Application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: 3. Validate Azure Deployment Credentials (QA)
        run: |
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE_QA" ] && [ -z "$DEPLOY_WEBHOOK_QA" ]; then
            echo "❌ ERROR: Faltan las credenciales de despliegue de Azure para QA en GitHub Secrets."
            echo "   Debe configurar AZURE_WEBAPP_PUBLISH_PROFILE_QA o DEPLOY_WEBHOOK_QA en el repositorio."
            exit 1
          fi
          echo "✅ Credenciales de despliegue para QA validadas."

      - name: 4. Deploy to Azure Web App (QA)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_QA != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: styleradar-donaciones-qa-jmunar
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          package: 'target/*.jar'

      - name: 5. Deploy via Webhook (QA Fallback)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_QA == '' && env.DEPLOY_WEBHOOK_QA != ''
        run: |
          echo "-> Invocando Webhook de despliegue QA..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_WEBHOOK_QA")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ ERROR: El webhook de despliegue QA retornó código HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Webhook de despliegue QA ejecutado exitosamente (HTTP $HTTP_CODE)."

      - name: 6. QA Smoke Test, Health Check & Deployment Verification
        run: |
          QA_HEALTH_URL="${{ vars.QA_APP_URL || 'https://styleradar-donaciones-qa-jmunar.azurewebsites.net' }}/api/v1/health"
          EXPECTED_COMMIT_SHA="${{ github.sha }}"
          echo "======================================================================"
          echo " Iniciando Smoke Test contra endpoint de salud de QA: $QA_HEALTH_URL"
          echo " Commit SHA esperado a verificar: $EXPECTED_COMMIT_SHA"
          echo "======================================================================"

          SUCCESS=false
          for i in {1..20}; do
            echo "Intento $i de 20..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$QA_HEALTH_URL" || true)
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "HTTP Status -> $HTTP_STATUS"
            echo "Response Body -> $BODY"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              STATUS_FIELD=$(echo "$BODY" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || true)
              COMMIT_SHA_FIELD=$(echo "$BODY" | grep -o '"commitSha":"[^"]*"' | cut -d'"' -f4 || true)

              if [ "$STATUS_FIELD" = "UP" ]; then
                echo "-> Estado del servicio en QA: UP"
                if [ -z "$COMMIT_SHA_FIELD" ]; then
                  echo "⏳ El commitSha aún no está presente en la respuesta (posible reinicio en curso con versión previa)..."
                elif [ "$COMMIT_SHA_FIELD" != "$EXPECTED_COMMIT_SHA" ] && [[ "$EXPECTED_COMMIT_SHA" != "$COMMIT_SHA_FIELD"* ]]; then
                  echo "⏳ El commitSha reportado ($COMMIT_SHA_FIELD) aún no coincide con el nuevo commit ($EXPECTED_COMMIT_SHA). Esperando propagación del artefacto..."
                else
                  echo "✅ Commit SHA desplegado en QA verificado exitosamente: $COMMIT_SHA_FIELD"
                  SUCCESS=true
                  break
                fi
              fi
            fi
            sleep 10
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ ERROR CRÍTICO: El health check de QA no confirmó el despliegue del commit $EXPECTED_COMMIT_SHA con status UP tras 20 intentos (200s)."
            echo "El nuevo artefacto no se desplegó correctamente en: $QA_HEALTH_URL"
            exit 1
          fi
          echo "✅ Despliegue en QA completado y verificado con éxito."
