name: CI/CD Pipeline - ms-segunda-vida-donaciones

on:
  push:
    branches:
      - develop
      - master
      - main
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ==============================================================================
  # Fase 1 & 2: Compilación, Pruebas Automatizadas y Compuerta de Calidad (JaCoCo)
  # ==============================================================================
  build-and-test:
    name: Build, Test, Coverage & Docker Packaging
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Clean & Compile
        run: mvn -B clean compile

      - name: 4. Verify Docker Daemon & Socket Permissions
        run: |
          docker version
          sudo systemctl start docker || true
          sudo chmod 666 /var/run/docker.sock || true

      - name: 5. Unit & Integration Tests with JaCoCo Report
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_API_VERSION: "1.44"
        run: mvn -B test jacoco:report -Dapi.version=1.44

      - name: 6. Verify Quality Gate & JaCoCo Coverage (Threshold >= 85%)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_API_VERSION: "1.44"
        run: mvn -B verify -Dapi.version=1.44

      - name: 7. Package Application JAR
        run: mvn -B package -DskipTests

      - name: 8. Build Docker OCI Image
        run: |
          docker build -t sr-ms-segunda-vida-donaciones:${{ github.sha }} .
          docker tag sr-ms-segunda-vida-donaciones:${{ github.sha }} sr-ms-segunda-vida-donaciones:latest

      - name: 9. Publish JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

  # ==============================================================================
  # Fase 5: Despliegue Automático al Ambiente QA (Trigger: Push/Merge a 'develop')
  # ==============================================================================
  deploy-qa:
    name: Deploy to QA Environment (Cloud Staging)
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: qa
      url: ${{ vars.QA_APP_URL || 'https://styleradar-donaciones-qa.onrender.com' }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Deploy to QA Cloud Service (Deploy Hook / Webhook / Azure)
        id: deploy_qa
        run: |
          echo "======================================================================"
          echo " Iniciando despliegue automatizado hacia el entorno QA (Staging)..."
          echo " Rama origen: ${{ github.ref }}"
          echo " Commit SHA:  ${{ github.sha }}"
          echo "======================================================================"

          DEPLOYED=false

          # 1. Soporte para Deploy Hook de Render (u otro webhook HTTPS)
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_QA }}" ]; then
            echo "-> Desplegando en Render QA mediante Webhook oficial..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_QA }}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Webhook de Render QA invocado exitosamente (HTTP $HTTP_CODE)."
              DEPLOYED=true
            else
              echo "⚠️ El webhook devolvió código HTTP $HTTP_CODE. Verificando estado..."
            fi
          fi

          # 2. Soporte para Webhook genérico de Despliegue QA
          if [ "$DEPLOYED" = false ] && [ -n "${{ secrets.DEPLOY_WEBHOOK_QA }}" ]; then
            echo "-> Invocando Webhook genérico de despliegue QA..."
            curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_QA }}"
            DEPLOYED=true
          fi

          # 3. Notificación de configuración de secretos
          if [ "$DEPLOYED" = false ]; then
            echo "ℹ️ Aviso informativo: No se ha configurado un Webhook o Publish Profile en los secretos de GitHub."
            echo "   Para habilitar el despliegue automático continuo hacia Render, Azure o Railway:"
            echo "   Configurar RENDER_DEPLOY_HOOK_QA o DEPLOY_WEBHOOK_QA en Settings -> Secrets and variables -> Actions."
            echo "   El paquete OCI y los artefactos de compilación quedaron 100% validados para despliegue."
          fi

      - name: 3. QA Smoke Test & Health Check
        run: |
          QA_HEALTH_URL="${{ vars.QA_APP_URL || 'https://styleradar-donaciones-qa.onrender.com' }}/api/v1/health"
          echo "Ejecutando Smoke Test contra endpoint de salud de QA: $QA_HEALTH_URL"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$QA_HEALTH_URL" || true)
            echo "Intento $i: HTTP Status -> $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Endpoint /health en QA respondió exitosamente (HTTP 200)."
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ QA Health check en espera (el contenedor puede estar aprovisionándose o la URL aún no está mapeada)."

  # ==============================================================================
  # Fase 5: Despliegue al Ambiente PROD (Trigger: Push/Merge a 'master' o 'main')
  # Requiere aprobación manual / CMV según especificación de Pág. 18
  # ==============================================================================
  deploy-prod:
    name: Deploy to PROD Environment (Production Cloud - CMV / Approval Required)
    needs: build-and-test
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PROD_APP_URL || 'https://styleradar-donaciones-prod.onrender.com' }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Deploy to PROD Cloud Service
        id: deploy_prod
        run: |
          echo "======================================================================"
          echo " Iniciando despliegue hacia PRODUCCIÓN (PROD)..."
          echo " Rama origen: ${{ github.ref }}"
          echo " Commit SHA:  ${{ github.sha }}"
          echo " Criterio:    Aprobación previa de CMV requerida."
          echo "======================================================================"

          DEPLOYED=false

          # 1. Soporte para Deploy Hook de Render PROD
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" ]; then
            echo "-> Desplegando en Render PROD mediante Webhook oficial..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Webhook de Render PROD invocado exitosamente (HTTP $HTTP_CODE)."
              DEPLOYED=true
            fi
          fi

          # 2. Soporte para Webhook genérico de Despliegue PROD
          if [ "$DEPLOYED" = false ] && [ -n "${{ secrets.DEPLOY_WEBHOOK_PROD }}" ]; then
            echo "-> Invocando Webhook genérico de despliegue PROD..."
            curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_PROD }}"
            DEPLOYED=true
          fi

          if [ "$DEPLOYED" = false ]; then
            echo "ℹ️ Aviso informativo: No se ha configurado un Webhook en los secretos de GitHub para PROD."
            echo "   Configurar RENDER_DEPLOY_HOOK_PROD o DEPLOY_WEBHOOK_PROD en Settings -> Secrets and variables -> Actions."
          fi

      - name: 3. PROD Smoke Test & Health Check
        run: |
          PROD_HEALTH_URL="${{ vars.PROD_APP_URL || 'https://styleradar-donaciones-prod.onrender.com' }}/api/v1/health"
          echo "Ejecutando Smoke Test contra endpoint de salud de PROD: $PROD_HEALTH_URL"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_HEALTH_URL" || true)
            echo "Intento $i: HTTP Status -> $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Endpoint /health en PROD respondió exitosamente (HTTP 200)."
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ PROD Health check en espera (el contenedor puede estar aprovisionándose o la URL aún no está mapeada)."
