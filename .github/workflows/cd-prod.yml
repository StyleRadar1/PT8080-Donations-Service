name: CD Production Pipeline - ms-segunda-vida-donaciones

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ==============================================================================
  # Fase 1 & 2: Compilación, Pruebas Automatizadas y Compuerta de Calidad (JaCoCo)
  # ==============================================================================
  build-and-verify:
    name: Build, Verify Quality Gate & Package Release (PROD)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 2.1 Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: 3. Clean & Compile
        run: ./mvnw -B clean compile

      - name: 4. Verify Docker Daemon & Socket Permissions
        run: |
          docker version
          sudo systemctl start docker || true
          sudo chmod 666 /var/run/docker.sock || true

      - name: 5. Unit & Integration Tests with JaCoCo Report & Quality Gate (>= 85% Line / >= 80% Branch)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_API_VERSION: "1.44"
        run: ./mvnw -B verify -Dapi.version=1.44

      - name: 6. SonarQube / SonarCloud Quality Gate Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "❌ ERROR: SONAR_TOKEN no está configurado en GitHub Repository Secrets (obligatorio en rama productiva main/master)."
            exit 1
          fi
          SONAR_ARGS="-Dsonar.qualitygate.wait=true"
          if [ -n "$SONAR_HOST_URL" ]; then
            SONAR_ARGS="$SONAR_ARGS -Dsonar.host.url=$SONAR_HOST_URL"
          fi
          if [ -n "$SONAR_ORGANIZATION" ]; then
            SONAR_ARGS="$SONAR_ARGS -Dsonar.organization=$SONAR_ORGANIZATION"
          fi
          if [ -n "$SONAR_PROJECT_KEY" ]; then
            SONAR_ARGS="$SONAR_ARGS -Dsonar.projectKey=$SONAR_PROJECT_KEY"
          fi
          ./mvnw -B sonar:sonar $SONAR_ARGS

      - name: 7. Package Production Release JAR
        run: ./mvnw -B package -DskipTests -Dbuild.commit.sha=${{ github.sha }}

      - name: 8. Build Docker OCI Image
        run: |
          docker build --build-arg COMMIT_SHA=${{ github.sha }} -t sr-ms-segunda-vida-donaciones:${{ github.sha }} .
          docker tag sr-ms-segunda-vida-donaciones:${{ github.sha }} sr-ms-segunda-vida-donaciones:latest

      - name: 9. Publish JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report-prod
          path: target/site/jacoco/
          retention-days: 14

      - name: 10. Publish Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar-prod
          path: target/ms-segunda-vida-donaciones-*.jar
          retention-days: 7

  # ==============================================================================
  # Fase 3: Despliegue al Ambiente PROD (Trigger: Push/Merge a 'master' o 'main')
  # Requiere aprobación previa de CMV y validación de compuerta
  # ==============================================================================
  deploy-prod:
    name: Deploy to PROD Environment (Azure Production Cloud - CMV / Approval Required)
    needs: build-and-verify
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: ${{ vars.PROD_APP_URL || 'https://styleradar-donaciones-prod-jmunar.azurewebsites.net' }}
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE_PROD: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
      DEPLOY_WEBHOOK_PROD: ${{ secrets.DEPLOY_WEBHOOK_PROD }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Download Application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar-prod
          path: target

      - name: 3. Validate Azure Deployment Credentials (PROD)
        run: |
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE_PROD" ] && [ -z "$DEPLOY_WEBHOOK_PROD" ]; then
            echo "❌ ERROR: Faltan las credenciales de despliegue de Azure para PROD en GitHub Secrets."
            echo "   Debe configurar AZURE_WEBAPP_PUBLISH_PROFILE_PROD o DEPLOY_WEBHOOK_PROD en el repositorio."
            exit 1
          fi
          echo "✅ Credenciales de despliegue para PROD validadas."

      - name: 4. Deploy to Azure Web App (PROD)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_PROD != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: styleradar-donaciones-prod-jmunar
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: 'target/*.jar'

      - name: 5. Deploy via Webhook (PROD Fallback)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE_PROD == '' && env.DEPLOY_WEBHOOK_PROD != ''
        run: |
          echo "-> Invocando Webhook de despliegue PROD..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_WEBHOOK_PROD")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ ERROR: El webhook de despliegue PROD retornó código HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Webhook de despliegue PROD ejecutado exitosamente (HTTP $HTTP_CODE)."

      - name: 6. PROD Smoke Test, Health Check & Swagger Restriction Verification
        run: |
          PROD_BASE_URL="${{ vars.PROD_APP_URL || 'https://styleradar-donaciones-prod-jmunar.azurewebsites.net' }}"
          PROD_HEALTH_URL="$PROD_BASE_URL/api/v1/health"
          PROD_SWAGGER_DOCS_URL="$PROD_BASE_URL/api/v1/v3/api-docs"
          PROD_SWAGGER_UI_URL="$PROD_BASE_URL/api/v1/swagger-ui/index.html"
          EXPECTED_COMMIT_SHA="${{ github.sha }}"
          echo "======================================================================"
          echo " Iniciando Smoke Test en PROD:"
          echo "   Health Check : $PROD_HEALTH_URL"
          echo "   Swagger Off  : $PROD_SWAGGER_DOCS_URL & $PROD_SWAGGER_UI_URL (esperado 401/403/404)"
          echo "   Commit SHA   : $EXPECTED_COMMIT_SHA"
          echo "======================================================================"

          SUCCESS=false
          for i in {1..30}; do
            echo "Intento $i de 30..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$PROD_HEALTH_URL" || true)
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "Health HTTP Status -> $HTTP_STATUS"
            echo "Health Response Body -> $BODY"

            if [ "$HTTP_STATUS" = "200" ]; then
              STATUS_FIELD=$(echo "$BODY" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || true)
              COMMIT_SHA_FIELD=$(echo "$BODY" | grep -o '"commitSha":"[^"]*"' | cut -d'"' -f4 || true)

              if [ "$STATUS_FIELD" = "UP" ]; then
                echo "-> Estado del servicio en PROD: UP"
                if [ -z "$COMMIT_SHA_FIELD" ]; then
                  echo "⏳ El commitSha aún no está presente en la respuesta (posible reinicio en curso con versión previa)..."
                elif [ "$COMMIT_SHA_FIELD" != "$EXPECTED_COMMIT_SHA" ] && [[ "$EXPECTED_COMMIT_SHA" != "$COMMIT_SHA_FIELD"* ]]; then
                  echo "⏳ El commitSha reportado ($COMMIT_SHA_FIELD) aún no coincide con el nuevo commit ($EXPECTED_COMMIT_SHA). Esperando propagación del artefacto..."
                else
                  SWAGGER_DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_SWAGGER_DOCS_URL" || true)
                  SWAGGER_UI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_SWAGGER_UI_URL" || true)
                  echo "PROD Swagger OpenAPI HTTP -> $SWAGGER_DOCS_STATUS | PROD Swagger UI HTTP -> $SWAGGER_UI_STATUS"
                  if [[ "$SWAGGER_DOCS_STATUS" =~ ^(401|403|404)$ ]] && [[ "$SWAGGER_UI_STATUS" =~ ^(401|403|404)$ ]]; then
                    echo "✅ Commit SHA desplegado ($COMMIT_SHA_FIELD) y restricción de Swagger en PROD (401/403/404) verificados exitosamente."
                    SUCCESS=true
                    break
                  fi
                  echo "⏳ Swagger en PROD respondió HTTP $SWAGGER_DOCS_STATUS / $SWAGGER_UI_STATUS (esperado 401/403/404). Reintentando..."
                fi
              fi
            fi
            sleep 10
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ ERROR CRÍTICO: El Smoke Test de PROD no confirmó UP + commit $EXPECTED_COMMIT_SHA + Swagger deshabilitado tras 30 intentos (300s)."
            exit 1
          fi
          echo "✅ Despliegue en PROD completado y verificado con éxito."
